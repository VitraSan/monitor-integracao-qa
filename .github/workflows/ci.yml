name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jest:
    name: Unitários, API e contrato (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage -- --ci

  postman:
    name: Coleção Postman (Newman)
    runs-on: ubuntu-latest
    needs: jest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Subir a API
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/saude && exit 0
            sleep 1
          done
          echo "API não subiu" && exit 1
      - run: npm run test:postman
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-newman
          path: reports/
          retention-days: 14
